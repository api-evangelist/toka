aid: toka
name: Toka
description: Toka is a defense and intelligence technology company, founded in 2017-2018
  and headquartered in Maryland with R&D in Israel, that develops signals intelligence,
  ISR, cyber operations, and force protection capabilities exclusively for militaries,
  homeland security organizations, intelligence agencies, and law enforcement in the
  United States and allied nations. Backed by Andreessen Horowitz (a16z), Eclipse Ventures,
  and Dell Technologies Capital, Toka sells government-facing capability platforms and
  cyber capacity-building services rather than a public developer or API surface, and
  publishes no developer portal, documentation, or machine-readable API artifacts.
